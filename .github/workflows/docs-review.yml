name: Docs Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/model_eval_harness/**"
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review docs coverage
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run docs review agent
        run: uv run python .github/scripts/docs_review.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'docs-review-comment.md';

            if (!fs.existsSync(path)) {
              console.log('No review output generated.');
              return;
            }

            const body = fs.readFileSync(path, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('model-eval-harness docs-review agent')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
